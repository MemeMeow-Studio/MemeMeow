[project]
name = "mememeow"
version = "2.0.0"
description = "FastAPI and Vue image search workbench"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-dotenv>=1.0",
  "pydantic-settings>=2.0,<3",
  "python-multipart>=0.0.9",
  "numpy>=2.0",
  "pillow>=10.0",
  "openai>=1.40",
  "jsonschema>=4.23",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.13,<2",
  "pgvector>=0.3,<1",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
