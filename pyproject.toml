[project]
name = "mememeow"
version = "2.0.0"
description = "FastAPI and Vue image search workbench"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-dotenv>=1.0",
  "pydantic-settings>=2.0,<3",
  "python-multipart>=0.0.9",
  "numpy>=2.0",
  "pillow>=10.0",
  "openai>=1.40",
  "jsonschema>=4.23",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.13,<2",
  "pgvector>=0.3,<1",
  "google-auth[requests]>=2.40,<3",
  "loguru>=0.7.3",
  "werkzeug>=3.1,<4",
  "opentelemetry-sdk==1.45.1",
  "opentelemetry-exporter-otlp-proto-http==1.45.1",
  "opentelemetry-instrumentation-fastapi==0.66b1",
  "opentelemetry-instrumentation-httpx==0.66b1",
  "opentelemetry-instrumentation-requests==0.66b1",
  "opentelemetry-instrumentation-urllib==0.66b1",
  "opentelemetry-instrumentation-sqlalchemy==0.66b1",
  "opentelemetry-instrumentation-threading==0.66b1",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
